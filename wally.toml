[package]
name = "kaan650/vide-topbar"
version = "0.1.0"
description = "Topbar icons for Vide, drawn with Foundation"
license = "MIT"
authors = ["kaan650"]
repository = "https://github.com/kaan650/vide-topbar"
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"
exclude = ["**"]
include = ["src", "src/**", "default.project.json", "wally.toml", "README.md", "LICENSE"]

[dependencies]
Vide = "centau/vide@0.4.1"
VideFoundation = "kaan650/vide-foundation@0.2.0"

[dev-dependencies]
UILabs = "pepeeltoro41/ui-labs@2.4.2"
